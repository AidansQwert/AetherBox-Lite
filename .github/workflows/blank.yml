name: Build & Release APK

# Triggers:
# 1. Push a tag like "v0.1.5" -> builds and publishes a GitHub Release automatically.
# 2. Manual run from the Actions tab (workflow_dispatch) -> builds and publishes too.
on:
  push:
    tags:
      - "v0.1.5"
  workflow_dispatch:

permissions:
  contents: write   # needed so the workflow can create a Release and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Optional: decode a real release keystore if you've added the secrets below
      # in Settings -> Secrets and variables -> Actions:
      #   KEYSTORE_BASE64   (base64 of your .keystore file, e.g. `base64 -w0 droidspaces.keystore`)
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD
      # If KEYSTORE_BASE64 is not set, this step is skipped and the build falls
      # back to an unsigned release APK (build.gradle.kts already handles that case).
      - name: Decode signing keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > droidspaces.keystore

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Create GitHub Release & upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          # When triggered manually (no tag), fall back to a "latest-build" tag
          # so the workflow still succeeds instead of failing on a missing tag.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Manual build {0}', github.run_number) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
